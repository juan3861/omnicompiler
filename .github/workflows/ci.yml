name: CI / Formal Verification & Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: SMT Translation Validation & Multi-Repository Pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: 1. Run 24 Adversarial Security & Compiler Fixtures
      run: |
        python benchmarks/adversarial_fixtures.py

    - name: 2. Run Multi-Repo Empirical Synthesis Audit (14 Gates)
      run: |
        python test_empirical_audit.py

    - name: 3. Test Recursive Bootstrap Cycle (Gen N compiles Gen N+1)
      run: |
        python evolution/recursive_bootstrap_loop.py --steps 3 --interval 0.5

    - name: 4. Run OmniMutator 8-Category AST Superoptimizer & Z3 SMT Proofs
      run: |
        python test_empirical_evolution_audit.py

    - name: 5. Run Frontier Breakthrough (E-Graphs, CEGIS Synthesis & Memory Frame Verification)
      run: |
        python test_frontier_breakthrough.py

    - name: 6. Run Supreme Ceiling Audit (Omni-SSA IR, Native x86-64 JIT Silicon & CPG Taint)
      run: |
        python test_supreme_ceiling_audit.py

    - name: 7. Run Subsystems Maturity Benchmark (MCTS, Standalone Binary, Chaitin-Briggs)
      run: |
        python test_compiler_subsystems_benchmark.py

    - name: 8. Run OmniRepo Compiler Multi-Repository E2E Pipeline & Unit Tests
      run: |
        python -m unittest discover tests -v
        python test_omni_repo_compiler_e2e.py
        python omnicompiler_cli.py compile

    - name: 9. Run SOTA Comparative Benchmarks & Convergence Verification
      run: |
        python external_component_candidates/benchmarks/comparative_benchmark.py
        python benchmarks/industrial_top1_suite.py

    - name: 10. Verify DWARF v5 ELF Sections & Line Tables with GDB & readelf (Ubuntu only)
      if: runner.os == 'Linux'
      run: |
        command -v gdb >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq gdb)
        python run_c88_tests.py --dwarf-gdb-check

    - name: 11. Verify Real Vulkan Compute (Lavapipe + spirv-val) & RV64GC QEMU Execution (Ubuntu only)
      if: runner.os == 'Linux'
      env:
        VK_REQUIRE_RUNTIME: "1"
        SPIRV_VAL_REQUIRE: "1"
        QEMU_RISCV64_REQUIRE: "1"
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq spirv-tools mesa-vulkan-drivers vulkan-tools qemu-user
        python run_c92_tests.py

  verify-macos-arm64:
    name: Apple Silicon ARM64 Mach-O & Native Execution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run ARM64 Mach-O, Linker & Hardware Atomic Tests on Apple Silicon
      run: |
        python -m unittest -v \
          tests.test_alpha_c69_arm64_rodata_macho_exec_and_transitive_ipsccp.TestAlphaC69Arm64RodataMachoExecAndTransitiveIpSccp.test_01_arm64_page21_lo12_rodata_relocations_across_elf_coff_and_macho \
          tests.test_alpha_c69_arm64_rodata_macho_exec_and_transitive_ipsccp.TestAlphaC69Arm64RodataMachoExecAndTransitiveIpSccp.test_02_dynamic_macho_executable_and_arm64_entry_offset_audit \
          tests.test_alpha_c70_macho_dyld_bind_and_f64_ipsccp.TestAlphaC70MachoDyldBindAndF64IpSccp.test_01_macho64_x86_64_and_arm64_dyld_bind_opcodes_and_got_patching \
          tests.test_alpha_c75_atomics_multithread_and_arm64_ci.TestAlphaC75AtomicsMultithreadAndArm64Ci.test_02_arm64_llsc_atomic_kernels_unicorn_execution
        python run_c87_tests.py
        python -c "import subprocess, tempfile, os; from compiler.binary_emitter import StandaloneBinaryEmitter; td = tempfile.mkdtemp(); p = StandaloneBinaryEmitter().emit_standalone_binary(os.path.join(td, 'omni_arm64_real'), target_format='arm64_macho', exit_code=42); os.chmod(p, 0o755); subprocess.run(['codesign', '-s', '-', p], check=True); rc = subprocess.run([p]).returncode; print('Apple Silicon ARM64 Mach-O exit:', rc); assert rc == 42"

  verify-linux-arm64:
    name: Linux AArch64 ARM64 ELF & Native Execution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run ARM64 ELF, TLS Heap & Native AArch64 Execution
      run: |
        python run_c76_tests.py
        python -c "import subprocess, tempfile, os; from compiler.binary_emitter import StandaloneBinaryEmitter; td = tempfile.mkdtemp(); p = StandaloneBinaryEmitter().emit_standalone_binary(os.path.join(td, 'omni_arm64_elf_real'), target_format='arm64_elf', exit_code=42); os.chmod(p, 0o755); rc = subprocess.run([p]).returncode; print('Linux AArch64 ARM64 ELF exit:', rc); assert rc == 42"


