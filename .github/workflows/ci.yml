name: CI / Formal Verification & Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: SMT Translation Validation & Multi-Repository Pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: 1. Run 24 Adversarial Security & Compiler Fixtures
      run: |
        python benchmarks/adversarial_fixtures.py

    - name: 2. Run Multi-Repo Empirical Synthesis Audit (14 Gates)
      run: |
        python test_empirical_audit.py

    - name: 3. Test Recursive Bootstrap Cycle (Gen N compiles Gen N+1)
      run: |
        python evolution/recursive_bootstrap_loop.py --steps 3 --interval 0.5

    - name: 4. Run OmniMutator 8-Category AST Superoptimizer & Z3 SMT Proofs
      run: |
        python test_empirical_evolution_audit.py

    - name: 5. Run Frontier Breakthrough (E-Graphs, CEGIS Synthesis & Memory Frame Verification)
      run: |
        python test_frontier_breakthrough.py

    - name: 6. Run Supreme Ceiling Audit (Omni-SSA IR, Native x86-64 JIT Silicon & CPG Taint)
      run: |
        python test_supreme_ceiling_audit.py

    - name: 7. Run Subsystems Maturity Benchmark (MCTS, Standalone Binary, Chaitin-Briggs)
      run: |
        python test_compiler_subsystems_benchmark.py

    - name: 8. Run OmniRepo Compiler Multi-Repository E2E Pipeline & Unit Tests
      run: |
        python -m unittest discover tests -v
        python test_omni_repo_compiler_e2e.py
        python omnicompiler_cli.py compile

    - name: 9. Run SOTA Comparative Benchmarks & Convergence Verification
      run: |
        python external_component_candidates/benchmarks/comparative_benchmark.py


